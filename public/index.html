<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Worktree Dashboard</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>Worktree Dashboard</h1>
    <div class="pills">
      <span id="totalCost" class="pill">Total est. cost: --</span>
      <span id="totalUsage" class="pill">Total tokens: --</span>
    </div>
  </header>

  <section id="settingsPanel" class="card">
    <h2>Project settings</h2>
    <div class="grid">
      <label title="The git root of your project. Worktrees are branched from here.">Project path (repo root)
        <input id="cfgRepoPath" placeholder="C:\Users\ana\code\my-app" />
      </label>
      <label title="Relative to the repo root. Leave blank if the dev command runs at the root. The dev command, the env file and node_modules all resolve inside this folder.">App subfolder (optional)
        <input id="cfgAppDir" placeholder="src/renderer" />
      </label>
      <label title="Run inside the app subfolder, in a terminal the dashboard opens for each worktree.">Dev command
        <input id="cfgDevCommand" placeholder="npm run dev" />
      </label>
      <label title="The env var your dev server reads its port from. Each worktree gets its own port in this var.">Port env var
        <input id="cfgPortEnvVar" placeholder="PORT" />
      </label>
      <label title="Copied from the app subfolder of the main repo into each new worktree, with the port var patched to that worktree's port.">Env file name
        <input id="cfgEnvFile" placeholder=".env.development" />
      </label>
      <label title="Ports are handed out from here upwards, one per worktree, and reclaimed when a worktree is removed.">Start port
        <input id="cfgStartPort" type="number" placeholder="5002" />
      </label>
      <label title="Where worktree folders are created. Defaults to a .worktrees folder next to your repo -- never inside it.">Worktrees folder (optional)
        <input id="cfgWorktreesRoot" placeholder="sibling .worktrees folder by default" />
      </label>
      <label title="Per-worktree estimated spend above which an optimization tip appears in the cost breakdown.">Cost alert threshold ($)
        <input id="cfgCostThreshold" type="number" placeholder="20" />
      </label>
    </div>
    <label>Model pricing ($ per 1M tokens) &mdash; JSON
      <textarea id="cfgPricing" rows="7" spellcheck="false"
        placeholder='{ "claude-sonnet-5": { "input": 2, "output": 10, "cacheWrite": 2.5, "cacheRead": 0.2 } }'></textarea>
    </label>
    <p id="appDirHint" class="hint muted"></p>
    <button id="saveConfig">Save settings</button>
    <span id="configStatus" class="muted"></span>
  </section>

  <section class="card">
    <h2>New worktree session</h2>
    <div class="grid">
      <label>Branch name
        <input id="newBranch" placeholder="feature/my-task" />
      </label>
      <label>Base ref (optional)
        <input id="newBaseRef" placeholder="main" />
      </label>
    </div>
    <label class="checkbox" title="Ticked: the terminal runs the dev server in the background and Claude in the foreground, and auto-commits when you exit Claude. Unticked: dev server only.">
      <input type="checkbox" id="newWithClaude" checked /> Run Claude in this session</label>
    <button id="createWorktree">Create worktree + launch session</button>
    <span id="createStatus" class="muted"></span>
  </section>

  <section class="card">
    <h2>Worktrees</h2>
    <div class="toolbar">
      <input id="branchFilter" placeholder="Filter by branch..." />
      <span class="spacer"></span>
      <button class="secondary" id="pagePrev">Prev</button>
      <span id="pageLabel" class="muted">Page 1 of 1</span>
      <button class="secondary" id="pageNext">Next</button>
    </div>
    <table id="wtTable">
      <thead>
        <tr>
          <th>Branch</th><th>Path</th><th>Port</th><th>Status</th><th>Cost</th><th>Tokens</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="wtBody"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
